name: PR Checks

on:
  pull_request:
    branches: [master]

jobs:
  # ── Job 1: fast static tests (no browser needed) ────────────────────────
  static-tests:
    name: Unit / Accessibility / Snapshot / Coverage
    runs-on: ubuntu-latest

    # Needed so the job can post a coverage table as a PR comment
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Accessibility tests (jest-axe)
        run: npm run test:a11y

      - name: Snapshot tests
        run: npm run test:snapshot

      # Run unit tests again with --coverage to produce coverage-summary.json.
      # Jest caches results so this is fast; the coverage pass is the extra work.
      - name: Coverage (unit tests)
        run: npm run test:coverage

      # Upload the full HTML coverage report as a workflow artifact so reviewers
      # can drill into uncovered lines directly from the PR checks tab.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-pr-${{ github.event.pull_request.number }}
          path: coverage/
          retention-days: 14

      # Post a concise coverage table to the PR as a comment.
      # jq extracts lines/statements/functions/branches from the json-summary.
      # The comment is updated on subsequent pushes (find-comment + upsert).
      - name: Post coverage comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8')
            ).total;

            const fmt = (obj) =>
              `${obj.pct}% (${obj.covered}/${obj.total})`;

            const body = [
              '## Coverage report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Lines      | ${fmt(summary.lines)}      |`,
              `| Statements | ${fmt(summary.statements)} |`,
              `| Functions  | ${fmt(summary.functions)}  |`,
              `| Branches   | ${fmt(summary.branches)}   |`,
              '',
              `Full HTML report uploaded as artifact \`coverage-report-pr-${{ github.event.pull_request.number }}\`.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Coverage report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Job 2: security scanning (runs in parallel with static-tests) ────────
  #
  # Three complementary tools cover different threat surfaces:
  #
  #   npm audit      – known CVEs in third-party dependencies (supply chain)
  #   Semgrep        – SAST: finds insecure code patterns (XSS, injection, etc.)
  #   Gitleaks       – secret scanning: catches credentials committed by mistake
  #
  # Keeping this as a separate job means a CVE in a dependency doesn't block
  # the accessibility or snapshot feedback — engineers see all failures at once.
  security-scan:
    name: Security Scan (SAST · SCA · Secrets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits on the PR branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Software Composition Analysis: known CVEs in dependencies ─────────
      # --audit-level=high blocks on High/Critical only; Medium is reported but
      # not blocking so that a low-severity transitive dep doesn't stall a PR.
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high

      # ── SAST: static analysis for insecure code patterns ─────────────────
      # Semgrep's p/javascript ruleset catches common JS anti-patterns:
      # dangerouslySetInnerHTML, eval(), prototype pollution, etc.
      # --error exits non-zero on any finding, which fails the job.
      - name: SAST scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/html
            p/secrets
        env:
          # SEMGREP_APP_TOKEN is optional; omitting it uses the OSS engine only.
          # Add the secret to enable Semgrep Cloud dashboard visibility.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # ── Secret scanning: detect credentials in the commit history ─────────
      # Scans the diff between HEAD~N and HEAD on this PR so it only covers
      # new commits, not the entire repo history on every run.
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for org repos on the paid plan.
          # For public/personal repos the free tier covers this.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Job 3: Playwright (only if static tests AND security scan pass) ──────
  #
  # Split by named spec-group (not Playwright's numeric --shard) so each
  # group shows up as its own entry in the PR checks list -- e.g. "Playwright
  # — visual" -- and a flaky failure in one group can be re-run by itself
  # from the Actions UI/API instead of re-running the whole ~300-test suite.
  # fail-fast: false so one group failing doesn't cancel the others mid-run.
  playwright:
    name: Playwright — ${{ matrix.group.name }}
    needs: [static-tests, security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: a11y,       pattern: tests/e2e/accessibility.spec.js }
          - { name: mobile,     pattern: tests/e2e/mobile.spec.js }
          - { name: security,   pattern: tests/e2e/security.spec.js }
          - { name: seo,        pattern: tests/e2e/seo.spec.js tests/e2e/robots-sitemap.spec.js }
          - { name: visual,     pattern: tests/e2e/visual.spec.js }
          - { name: functional, pattern: tests/e2e/navigation.spec.js tests/e2e/experience.spec.js tests/e2e/education.spec.js tests/e2e/quality-suite.spec.js tests/e2e/ai-engineering.spec.js }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Browser binaries are the slow part of "install Playwright browsers"
      # (~100+ MB Chromium download); caching them keyed on the installed
      # version means most runs skip straight to the OS-deps step below.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        # npx playwright install is idempotent -- if the cache above already
        # has a matching-version Chromium, this skips the download and just
        # verifies/installs the OS-level dependencies (not cacheable the
        # same way on ephemeral runners), so it's still fast on a cache hit.

      - name: Run Playwright tests (${{ matrix.group.name }})
        run: npx playwright test ${{ matrix.group.pattern }}
        # playwright.config.js automatically starts `npx serve -p 3000 .`
        # when BASE_URL is not set, so no manual server step needed. Runs
        # against both configured projects (chromium, mobile-chrome) for
        # every file in this group, same as the unsplit suite did.

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-pr-${{ matrix.group.name }}
          path: playwright-report/
          retention-days: 7
