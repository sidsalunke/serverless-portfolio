name: PR Checks

on:
  pull_request:
    branches: [master]

jobs:
  # ── Job 1: fast static tests (no browser needed) ────────────────────────
  static-tests:
    name: Unit / Accessibility / Snapshot / Coverage
    runs-on: ubuntu-latest

    # Needed so the job can post a coverage table as a PR comment
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Accessibility tests (jest-axe)
        run: npm run test:a11y

      - name: Snapshot tests
        run: npm run test:snapshot

      # Run unit tests again with --coverage to produce coverage-summary.json.
      # Jest caches results so this is fast; the coverage pass is the extra work.
      - name: Coverage (unit tests)
        run: npm run test:coverage

      # Upload the full HTML coverage report as a workflow artifact so reviewers
      # can drill into uncovered lines directly from the PR checks tab.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-pr-${{ github.event.pull_request.number }}
          path: coverage/
          retention-days: 14

      # Post a concise coverage table to the PR as a comment.
      # jq extracts lines/statements/functions/branches from the json-summary.
      # The comment is updated on subsequent pushes (find-comment + upsert).
      - name: Post coverage comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8')
            ).total;

            const fmt = (obj) =>
              `${obj.pct}% (${obj.covered}/${obj.total})`;

            const body = [
              '## Coverage report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Lines      | ${fmt(summary.lines)}      |`,
              `| Statements | ${fmt(summary.statements)} |`,
              `| Functions  | ${fmt(summary.functions)}  |`,
              `| Branches   | ${fmt(summary.branches)}   |`,
              '',
              `Full HTML report uploaded as artifact \`coverage-report-pr-${{ github.event.pull_request.number }}\`.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Coverage report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Job 2: security scanning (runs in parallel with static-tests) ────────
  #
  # Three complementary tools cover different threat surfaces:
  #
  #   npm audit      – known CVEs in third-party dependencies (supply chain)
  #   Semgrep        – SAST: finds insecure code patterns (XSS, injection, etc.)
  #   Gitleaks       – secret scanning: catches credentials committed by mistake
  #
  # Keeping this as a separate job means a CVE in a dependency doesn't block
  # the accessibility or snapshot feedback — engineers see all failures at once.
  security-scan:
    name: Security Scan (SAST · SCA · Secrets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history to scan all commits on the PR branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Software Composition Analysis: known CVEs in dependencies ─────────
      # --audit-level=high blocks on High/Critical only; Medium is reported but
      # not blocking so that a low-severity transitive dep doesn't stall a PR.
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high

      # ── SAST: static analysis for insecure code patterns ─────────────────
      # Semgrep's p/javascript ruleset catches common JS anti-patterns:
      # dangerouslySetInnerHTML, eval(), prototype pollution, etc.
      # --error exits non-zero on any finding, which fails the job.
      - name: SAST scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/html
            p/secrets
        env:
          # SEMGREP_APP_TOKEN is optional; omitting it uses the OSS engine only.
          # Add the secret to enable Semgrep Cloud dashboard visibility.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # ── Secret scanning: detect credentials in the commit history ─────────
      # Scans the diff between HEAD~N and HEAD on this PR so it only covers
      # new commits, not the entire repo history on every run.
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for org repos on the paid plan.
          # For public/personal repos the free tier covers this.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Job 3: Playwright (only if static tests AND security scan pass) ──────
  playwright:
    name: Playwright — functional, visual, a11y & security (local server)
    needs: [static-tests, security-scan]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        # playwright.config.js automatically starts `npx serve -p 3000 .`
        # when BASE_URL is not set, so no manual server step needed.
        # Includes tests/e2e/security.spec.js which asserts CSP, X-Content-Type-Options,
        # Referrer-Policy and Permissions-Policy meta tags are present and correct.

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-pr
          path: playwright-report/
          retention-days: 7
