name: Deploy & Verify

on:
  push:
    branches: [master]
    # Don't trigger a full deploy just because the snapshot update workflow
    # committed refreshed PNG baselines to master. Badge commits are already
    # guarded by [skip ci]; snapshots are guarded by paths-ignore here.
    paths-ignore:
      - 'tests/e2e/visual.spec.js-snapshots/**'
  workflow_dispatch:  # allows manual triggering from the Actions tab

jobs:
  # ── Job 1: push files to S3 ─────────────────────────────────────────────
  deploy:
    name: Deploy to S3 + CloudFront invalidation
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    # Expose the pre-deploy commit SHA so the rollback job can restore it
    # if the live E2E tests fail.
    outputs:
      previous-sha: ${{ steps.prev-sha.outputs.sha }}
      invalidation-id: ${{ steps.invalidation.outputs.id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD and HEAD~1 for rollback

      # Record the commit that is currently live before we overwrite it.
      # If E2E fails after deploy, the rollback job checks out this SHA
      # and re-syncs it to S3, restoring the last known-good state.
      - name: Record pre-deploy commit SHA
        id: prev-sha
        run: echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync static files to S3
        run: |
          aws s3 sync . s3://portfolio.sidsalunke.info \
            --exclude "*" \
            --include "*.html" \
            --include "styles/*" \
            --include "js/app.js" \
            --include "images/*" \
            --delete
        # Note: --acl public-read is intentionally omitted.
        # CloudFront OAC (configured in the console, codified in infra/main.tf)
        # is the only permitted reader. Public S3 URLs return 403.

      # Capture the invalidation ID so we can wait for it to finish before
      # running E2E tests. Without waiting, tests may hit stale CDN cache
      # and pass against old content, making the canary check meaningless.
      - name: Invalidate CloudFront cache
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "id=$INVALIDATION_ID" >> $GITHUB_OUTPUT

      # Poll until CloudFront confirms the invalidation is complete (~1-3 min).
      # Only then is the new content guaranteed to be live globally.
      - name: Wait for CloudFront invalidation to complete
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id ${{ steps.invalidation.outputs.id }}

  # ── Job 2: generate and upload SBOM (runs in parallel with deploy) ───────
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install CycloneDX CLI
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM
        run: cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  # ── Job 3: E2E smoke tests against the live site ────────────────────────
  # Runs only after deploy completes AND the CloudFront invalidation is done,
  # so tests always exercise the freshly deployed content — not stale cache.
  e2e-live:
    name: E2E smoke tests — live site
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests — live site
        run: npx playwright test --project=chromium
        env:
          BASE_URL: https://portfolio.sidsalunke.info
        # BASE_URL tells playwright.config.js to skip the local dev server
        # and run all tests against the live CloudFront distribution.
        # Includes security.spec.js which verifies that the CSP and security
        # headers are being served correctly through CloudFront — not just
        # present in the HTML meta tags.

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-live-report
          path: playwright-report/
          retention-days: 14

  # ── Job 4: rollback if E2E tests failed ─────────────────────────────────
  #
  # This is the canary gate. If live E2E tests catch a regression, this job
  # automatically restores the previous known-good commit to S3 and
  # invalidates the CDN — users see the old version within ~1-3 minutes.
  #
  # Flow:
  #   deploy (records HEAD~1 SHA) ──► e2e-live ──► (pass) done
  #                                              └──► (fail) rollback ──► re-deploy HEAD~1
  rollback:
    name: Rollback to previous commit
    needs: [deploy, e2e-live]
    if: needs.e2e-live.result == 'failure'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Check out the commit that was live before this deploy.
      # git rev-parse HEAD~1 in the deploy job captured this SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.previous-sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Restore previous version to S3
        run: |
          aws s3 sync . s3://portfolio.sidsalunke.info \
            --exclude "*" \
            --include "*.html" \
            --include "styles/*" \
            --include "js/app.js" \
            --include "images/*" \
            --delete

      - name: Invalidate CloudFront after rollback
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID

      # Exit non-zero so the overall workflow is marked as failed.
      # This surfaces the regression clearly in GitHub — the deploy
      # job shows green (it deployed successfully) but the workflow
      # is red because the canary caught a problem.
      - name: Fail workflow to signal bad deployment was rolled back
        run: |
          echo "::error::Live E2E tests failed. Rolled back to commit ${{ needs.deploy.outputs.previous-sha }}. Check the e2e-live-report artefact for details."
          exit 1

  # ── Job 5: update metric badges and commit to master ────────────────────
  #
  # Runs only after live E2E tests pass (i.e., the deploy is confirmed good).
  # Generates fresh SVG badges for test coverage and Lighthouse scores,
  # then commits them directly to master with [skip ci] so the commit does
  # not trigger another deploy loop.
  #
  # Why commit badges to the repo rather than use a third-party service:
  #   - shields.io / codecov require an account and a public token
  #   - badge-maker generates identical SVGs with no external dependency
  #   - The badge files are committed so they render in the README on GitHub
  #     without a request to an external CDN
  update-badges:
    name: Update metric badges
    needs: e2e-live
    if: needs.e2e-live.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the badge commit

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the [skip ci] commit lands on master correctly
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Coverage badges ──────────────────────────────────────────────────
      # Re-run unit tests with coverage to get a fresh coverage-summary.json.
      # Tests are cached by Jest; the coverage pass is the only extra cost.
      - name: Generate coverage data
        run: npm run test:coverage

      # ── Lighthouse badges ────────────────────────────────────────────────
      # Run Lighthouse CI against the live site (already confirmed up by e2e-live).
      # lhci autorun writes JSON results to .lighthouseci/ which generate-badges.js reads.
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI against live site
        run: |
          lhci autorun \
            --collect.url=https://portfolio.sidsalunke.info \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=.lighthouseci
        continue-on-error: true
        # continue-on-error: if Lighthouse fails (e.g. network hiccup), we still
        # commit coverage badges. generate-badges.js emits "unknown" for missing data.

      # ── Generate SVG files ───────────────────────────────────────────────
      - name: Generate badge SVGs
        run: npm run generate-badges

      # ── Commit and push to badges branch ─────────────────────────────────
      # Badges are committed to the unprotected orphan `badges` branch rather
      # than master. This keeps master fully locked behind branch-protection
      # rules while still auto-updating SVGs on every successful deploy.
      # README references them via raw.githubusercontent.com URLs.
      - name: Commit updated badges to badges branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the freshly generated SVGs before switching branches, then
          # remove them from the working tree. Without this, `git checkout`
          # below refuses to switch branches: it won't silently overwrite
          # the (tracked-or-not) badges/*.svg files we just regenerated.
          cp badges/*.svg /tmp/
          rm -f badges/*.svg

          # Switch to the badges orphan branch.
          # Use -B with explicit origin/badges to avoid ambiguity between the
          # local badges/ directory (just created) and the remote branch name.
          git fetch origin badges
          git checkout -B badges origin/badges

          # Copy in the new SVGs
          cp /tmp/*.svg badges/

          git add badges/
          if git diff --cached --quiet; then
            echo "No badge changes — skipping commit."
          else
            git commit -m "chore: update metric badges [skip ci]"
            git push origin badges
          fi
